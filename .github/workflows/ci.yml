name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: engine tests (no renders)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: unit, contract, reference-analysis and audio tests
        run: python3 -m unittest discover -s tests -v

  typecheck:
    name: renderer typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: skills/promo-video/renderer/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: skills/promo-video/renderer
      - run: npx tsc --noEmit
        working-directory: skills/promo-video/renderer

  render:
    name: real renders (both modes, audio modes, formats)
    runs-on: ubuntu-24.04
    needs: [tests, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: skills/promo-video/renderer/package-lock.json
      - name: ffmpeg and headless Chrome libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libnss3 libdbus-1-3 libatk1.0-0 \
            libatk-bridge2.0-0 libgbm1 libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 \
            libxdamage1 libpango-1.0-0 libcairo2 libcups2
      - run: npm ci --no-audit --no-fund
        working-directory: skills/promo-video/renderer
      - name: render tests
        env:
          PROMO_RENDER: "1"
        run: python3 -m unittest tests.test_render tests.test_pipeline.EndToEnd -v
